  <!-- X+ . The X is the wordmark's own traced glyph with the "t" clipped away.
       Both are one <path> but two disjoint shapes, found by a connected-
       component pass over the rendered glyph. The clip below follows the X's
       own right edge plus 10 units - half the 21.2-unit clearance the two
       glyphs keep on every row they share, measured rather than guessed, so
       the boundary can never cut the X and can never keep the t.

       It follows the EDGE, not a straight line and not horizontal bands. A
       straight cut cannot work (the shapes interlock in x) and bands stair-
       step the diagonals; both were tried.

       The + sits in the X's WAIST. An X is widest at top and bottom - this one
       reaches x 200 there and only 56 at mid-height - so a plus in that notch
       adds 21 units to the mark's width rather than its own 54, which is what
       keeps the X near the centre of the icon. -->
