<!-- THE JUNO-X's PART BUTTON, GENERATED - not drawn by hand.

     Produced by the app's own renderer and pasted here:

       cd ~/roland-junox-editor && node -e "
         const api = require('./src/panel-svg.js');
         const s = api.renderRegions({}, { regions: [{ name: 'scene-button:2', mode: 'live' }] });
         console.log(s.match(/<g class=\"panel-region[^]*?<\/g>/)[0]);"

     which draws it from docs/Juno-X panel 1.png by way of src/panel-layout.js:
     bezel 57 x 38 rx 5 (#2b2b31 under a 1.2 stroke of #4a4a52), a rim of the
     lit colour at 20% (shade(use, 0.2)), a 42 x 21 face under the panel's
     radial inset, and the light ridge along the bottom lip. The origin is
     shifted to 0,0 and the viewBox carries a unit of padding so the bezel's
     stroke is not half-clipped. Nothing else is changed.

     THE RIM AND THE FACE ARE CLASSED so the stylesheet can swap blue for
     cyan on hover; the gradients themselves live once in the layout. -->
<svg class="pbtn-svg" viewBox="-1 -1 59 40" aria-hidden="true" focusable="false">
  <rect x="0" y="0" width="57" height="38" rx="5" fill="#2b2b31" stroke="#4a4a52" stroke-width="1.2"/>
  <rect class="pb-rim" x="3.5" y="4.5" width="50" height="29" rx="3"/>
  <rect class="pb-face" x="7.5" y="8.5" width="42" height="21" rx="2"/>
  <rect x="7.5" y="8.5" width="42" height="21" rx="2" fill="url(#jx-inset)"/>
  <rect x="5" y="35.4" width="47" height="1.6" rx="0.8" fill="#8e909a" fill-opacity="0.6"/>
</svg>
